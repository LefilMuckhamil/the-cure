<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#060608" />
    <title>THE CURE</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="aurora"></div>
    <div id="grid"></div>
    <canvas id="viz"></canvas>
    <div id="noise"></div>
    <div id="scan"></div>
    <div id="heart"></div>

    <div id="signal">
      <div id="camera">
        <div id="dolly">
          <div id="tilt">
            <div id="lens"><div id="field"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div id="vignette"></div>
    <div id="mood"></div>

    <div id="hud" aria-hidden="true">
      <div class="hud-top">
        <span class="hud-dot"></span>
        <span>THE CURE // LYRIC.SYSTEM</span>
        <span class="hud-mode" id="hudMode">SIGNAL</span>
      </div>
      <div class="hud-bottom">
        <span id="hudTime">00:00</span>
        <div class="hud-track"><div id="hudFill"></div></div>
        <span id="hudTotal">01:17</span>
      </div>
    </div>

    <div id="intro" aria-hidden="true">
      <div class="intro-word">THE</div>
      <div class="intro-word">CURE</div>
      <div class="intro-sub">LYRIC.SYSTEM // 77.27</div>
    </div>

    <button class="ghost-btn" id="edit">✎ LIRIK</button>

    <div class="eq" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <section id="console">
      <div class="console-head">
        <b>// EDITOR LIRIK</b>
        <span
          >muncul | tahan | teks · atau: teks = 2 detik · edit permanen di
          lyrics.js</span
        >
      </div>
      <textarea id="script" spellcheck="false"></textarea>
      <div class="console-actions">
        <button id="loadAudio">Ganti audio</button>
        <button id="styler">Rapikan</button>
        <button id="demo">Kembalikan contoh</button>
        <button id="close">Tutup</button>
        <button id="apply" class="primary">Terapkan ▶</button>
      </div>
    </section>

    <div id="toast"></div>

    <audio id="audio" src="the-cure.mp3" preload="metadata"></audio>
    <input type="file" id="audioFile" accept="audio/*" hidden />

    <script src="lyrics.js"></script>
    <script src="app.js"></script>
  </body>
</html>
